[workspace]
name = "roscon2026_the_legible_node_ws"
description = ""
channels = ["https://prefix.dev/conda-forge", "https://prefix.dev/robostack-lyrical"]
platforms = ["linux-64", "win-64", "osx-64", "osx-arm64", "linux-aarch64"]

[target.win.activation]
scripts = ["install/setup.bat"]

[target.unix.activation]
scripts = ["install/setup.bash"]

[dependencies]
python = "*"
jsonschema = "*"
"ruamel.yaml" = "*"
# Build tools
compilers = "*"
cmake = "*"
pkg-config = "*"
make = "*"
ninja = "*"
# ROS specific tools
rosdep = "*"
colcon-common-extensions = "*"
colcon-mixin = "*"
vcstool = "*"

# lyrical
ros-lyrical-desktop = "*"
ros-lyrical-message-filters = ">=7.4.1,<8"
ros-lyrical-pcl-ros = "*"
# Used by nodl_generator_cpp/_py to turn NoDL parameters into a parameter library
ros-lyrical-generate-parameter-library = "*"

[tasks]
# Clone source deps not available on the pixi/robostack channels (see deps.repos).
# Imported into src/deps/ which is gitignored.
import-deps = "mkdir -p src/deps && vcs import src/deps < deps.repos"
# Pull latest for the imported source deps
update-deps = "vcs pull src/deps"

[target.linux.dependencies]
libgl-devel = "*"

[target.linux-64.dependencies]
# The conda compiler *wrapper* packages ship etc/conda/activate.d/activate-gcc_linux-64.sh,
# which exports $LDFLAGS including "-Wl,--allow-shlib-undefined". CMake bakes that into
# CMAKE_EXE_LINKER_FLAGS, and it's required to link ROS C++ targets against RoboStack's
# *__rosidl_generator_py.so libs (which don't link libpython themselves; symbols are
# resolved at runtime). The compilers 2.0.0 metapackage dropped these wrapper deps, so we
# pin them explicitly. Arch-suffixed => linux-64 only (not target.linux, which also = aarch64).
gcc_linux-64 = "*"
gxx_linux-64 = "*"
