---

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ws
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          manifest-path: ws/pixi.toml
      - name: Import source dependencies
        run: pixi run import-deps
      - name: Build
        run: pixi run colcon build
      - name: Test
        run: pixi run colcon test
      - name: Test results
        run: pixi run colcon test-result --verbose
